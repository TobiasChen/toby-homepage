name: Deploy Frontend

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Caching  Node Modules
        id: node-cache-build
        uses: actions/cache@v3
        with:
          path: |
            node_modules
          key: ${{ runner.os }}--toby-homepage-site-build-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-toby-homepage-site-build-
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build

      # - name: Set AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v2
      #   with:
      #     role-to-assume: ${{ secrets.DEV_DEPLOY_ROLE }}
      #     role-session-name: OIDCSession
      #     aws-region: eu-central-1

      - run: aws s3 --endpoint-url ${{ secrets.GARAGE_API_URL }} sync ./dist/ s3://${{ secrets.GARAGE_BUCKET_NAME }}/ --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: garage
        shell: bash

      # - run: aws cloudfront create-invalidation --distribution-id E9A704PV7BYGZ --paths /index.html /dist/*
      #   shell: bash
